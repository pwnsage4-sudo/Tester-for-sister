<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тестер</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #b0bec5;
            --accent: #00e676;
            --accent-hover: #00c853;
            --danger: #ff1744;
            --primary: #29b6f6;
            --primary-hover: #039be5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Start Screen */
        .file-upload-wrapper {
            position: relative;
            text-align: center;
            margin-top: 20px;
        }

        .file-upload-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            display: inline-block;
            width: 100%;
            box-shadow: 0 4px 15px rgba(41, 182, 246, 0.4);
        }

        .file-upload-btn:active {
            transform: scale(0.95);
        }

        input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .loading-text {
            text-align: center;
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Quiz Screen */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option:active {
            transform: scale(0.98);
        }

        .option.correct {
            background: rgba(0, 230, 118, 0.2);
            border-color: var(--accent);
        }

        .option.wrong {
            background: rgba(255, 23, 68, 0.2);
            border-color: var(--danger);
        }
        
        .option.disabled {
            pointer-events: none;
        }

        .next-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            display: none;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }
        
        .next-btn:active {
            transform: scale(0.98);
        }

        /* Result Screen */
        .result-container {
            text-align: center;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.2);
        }

        .score-text {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            box-shadow: 0 4px 15px rgba(41, 182, 246, 0.4);
        }
        
        .restart-btn:active {
            transform: scale(0.95);
        }

    </style>
</head>

        let currentQuestionIndex = 0;
        let score = 0;

        // Elements

        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        

        
        const questionCounter = document.getElementById('question-counter');
        const scoreCounter = document.getElementById('score-counter');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        
        const finalScore = document.getElementById('final-score');
        const finalScoreText = document.getElementById('final-score-text');
        const restartBtn = document.getElementById('restart-btn');

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            questions = shuffleArray(questions);
            startQuiz();
        });



        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showScreen(screen) {
            quizScreen.classList.remove('active');
            resultScreen.classList.remove('active');
            screen.classList.add('active');
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            showScreen(quizScreen);
            loadQuestion();
        }

        function loadQuestion() {
            nextBtn.style.display = 'none';
            const currentQ = questions[currentQuestionIndex];
            
            questionCounter.textContent = `Сұрақ: ${currentQuestionIndex + 1} / ${questions.length}`;
            scoreCounter.textContent = `Ұпай: ${score}`;
            
            // Remove citations from question text if any (e.g. [cite: 3])
            const cleanQuestion = currentQ.question.replace(/\[cite:\s*\d+\]/g, '').trim();
            questionText.textContent = cleanQuestion;
            
            optionsContainer.innerHTML = '';
            
            // Shuffle options
            const shuffledOptions = shuffleArray(currentQ.options);
            
            shuffledOptions.forEach(optionText => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = optionText;
                btn.addEventListener('click', () => selectOption(btn, optionText, currentQ.answer));
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, selectedAnswer, correctAnswer) {
            // Disable all options
            const allOptions = optionsContainer.querySelectorAll('.option');
            allOptions.forEach(opt => opt.classList.add('disabled'));
            
            if (selectedAnswer === correctAnswer) {
                selectedBtn.classList.add('correct');
                score++;
                scoreCounter.textContent = `Ұпай: ${score}`;
            } else {
                selectedBtn.classList.add('wrong');
                // Find and highlight correct answer
                allOptions.forEach(opt => {
                    if (opt.textContent === correctAnswer) {
                        opt.classList.add('correct');
                    }
                });
            }
            
            nextBtn.style.display = 'block';
        }

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        });

        function showResult() {
            showScreen(resultScreen);
            const percentage = Math.round((score / questions.length) * 100);
            
            finalScore.textContent = `${percentage}%`;
            finalScoreText.textContent = `Сіз ${questions.length} сұрақтың ${score} дұрыс жауап бердіңіз.`;
            
            // Change color based on score
            if (percentage >= 80) {
                finalScore.parentElement.style.borderColor = "var(--accent)";
                finalScore.parentElement.style.boxShadow = "0 0 30px rgba(0, 230, 118, 0.2)";
                finalScore.style.color = "var(--accent)";
            } else if (percentage >= 50) {
                finalScore.parentElement.style.borderColor = "#ffd600";
                finalScore.parentElement.style.boxShadow = "0 0 30px rgba(255, 214, 0, 0.2)";
                finalScore.style.color = "#ffd600";
            } else {
                finalScore.parentElement.style.borderColor = "var(--danger)";
                finalScore.parentElement.style.boxShadow = "0 0 30px rgba(255, 23, 68, 0.2)";
                finalScore.style.color = "var(--danger)";
            }
        }

        restartBtn.addEventListener('click', () => {
            questions = shuffleArray(questions);
            startQuiz();
        });

    </script>
